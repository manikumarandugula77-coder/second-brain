# TradingBot Configuration

name: TradingBot
version: 1.0.0
description: Automated trading agent for market analysis and execution

paper_trading: true

# Risk Management
risk:
  max_positions: 5
  risk_per_trade: 0.02  # 2% of portfolio per trade
  max_drawdown: 0.15    # 15% max drawdown before stopping
  stop_loss_pct: 0.05   # 5% stop loss per position

# Strategies
strategies:
  momentum:
    enabled: true
    lookback_period: 20
    threshold: 0.02  # 2% price change trigger
  
  mean_reversion:
    enabled: false
    lookback_period: 50
    entry_z_score: 1.5
    exit_z_score: 0.5

# Trading Symbols
symbols:
  - SPY
  - QQQ
  - AAPL
  - TSLA
  - NVDA
  - BTC.USD
  - ETH.USD

# Schedule
schedule:
  check_interval: 300  # seconds
  market_hours_only: true
  trading_hours:
    start: "09:30"
    end: "16:00"
  timezone: "America/New_York"

# API Endpoints
api:
  alpaca:
    base_url: "https://paper-api.alpaca.markets"
  data:
    base_url: "https://data.alpaca.markets"

# Logging
logging:
  level: INFO
  file: ../logs/tradingbot.log
  max_size_mb: 10
  backup_count: 5
